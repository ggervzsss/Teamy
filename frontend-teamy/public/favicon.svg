<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="bg-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#12101e" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Electric Purple & Violet Main Accent Gradient -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glowing Pink-Magenta Accent Highlight -->
    <linearGradient id="glow-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Border Metallic Ring -->
    <linearGradient id="border-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3b0764" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Black Theme -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="url(#bg-black)" stroke="url(#border-purple)" stroke-width="6" />

  <!-- Ambient Purple Core Glow -->
  <circle cx="256" cy="220" r="150" fill="#8b5cf6" opacity="0.18" filter="url(#purple-glow)" />

  <!-- Project Management Emblem: Interlocking 'T' + Checkmark Flow -->
  <g filter="url(#purple-glow)">
    <!-- Top Bar of 'T' (Smooth Capsule with Magenta Accent) -->
    <rect x="100" y="140" width="312" height="68" rx="34" ry="34" fill="url(#purple-grad)" />

    <!-- Top Glow Highlight -->
    <rect x="130" y="152" width="252" height="12" rx="6" ry="6" fill="url(#glow-highlight)" opacity="0.8" />

    <!-- Stem of 'T' -->
    <rect x="222" y="140" width="68" height="236" rx="34" ry="34" fill="url(#purple-grad)" />

    <!-- Project Checkmark Motif (Swooping up from left to right stem) -->
    <path d="M 152 280 L 220 348 L 360 200" fill="none" stroke="url(#glow-highlight)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interactive Node Dots (Team Collaboration) -->
    <circle cx="152" cy="280" r="14" fill="#f0abfc" stroke="#8b5cf6" stroke-width="4" />
    <circle cx="360" cy="200" r="14" fill="#f0abfc" stroke="#8b5cf6" stroke-width="4" />
  </g>
</svg>
